<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입장 대기 - 예아단 특별공연</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="/static/js/csrf.js"></script>
</head>
<body>
<header class="navbar">
  <div class="brand">
    <div class="logo-icon"><i class="fa-solid fa-ticket"></i></div>
    예아단 특별공연
  </div>
  <nav>
    <a href="/"><i class="fa-solid fa-house"></i> 홈</a>
    <a href="/mypage"><i class="fa-solid fa-user"></i> 마이페이지</a>
  </nav>
  <div class="user-info">
    <i class="fa-solid fa-circle-user" style="font-size:18px;opacity:.8"></i>
    <span id="userName">로딩중...</span>님
    <button class="btn-logout" onclick="doLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
    </button>
  </div>
</header>

<div class="queue-wrap">
  <div class="queue-box">

    <!-- ① 연결 중 -->
    <div id="stateLoading" class="queue-state">
      <div class="queue-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <p class="queue-desc" style="margin-top:8px">대기열에 연결 중입니다...</p>
    </div>

    <!-- ② 대기 중 -->
    <div id="stateWaiting" class="queue-state" style="display:none">
      <div class="queue-icon waiting">
        <i class="fa-solid fa-hourglass-half"></i>
      </div>
      <h2 class="queue-title">현재 접속 대기 중입니다</h2>

      <div class="queue-stats">
        <div class="queue-stat-card primary">
          <div class="qsc-label">내 대기번호</div>
          <div class="qsc-value" id="myPosition">—</div>
          <div class="qsc-unit">번</div>
        </div>
        <div class="queue-stat-card">
          <div class="qsc-label">현재 입장 인원</div>
          <div class="qsc-value green" id="activeCount">—</div>
          <div class="qsc-unit">명</div>
        </div>
        <div class="queue-stat-card">
          <div class="qsc-label">예상 대기 시간</div>
          <div class="qsc-value orange" id="etaDisplay">—</div>
          <div class="qsc-unit" id="etaUnit">분</div>
        </div>
      </div>

      <!-- 프로그레스바 -->
      <div class="queue-progress-wrap">
        <div class="queue-progress-bar" id="queueProgressBar" style="width:50%"></div>
      </div>

      <p class="queue-desc">
        <i class="fa-solid fa-circle-info" style="color:#3b82f6;margin-right:5px"></i>
        앞 사람이 예매를 완료하면 자동으로 입장합니다.<br>
        <span style="font-size:12px;color:#9ca3af">이 창을 닫거나 새로고침해도 순번이 유지됩니다.</span>
      </p>
    </div>

    <!-- ③ 입장 가능 -->
    <div id="stateActive" class="queue-state" style="display:none">
      <div class="queue-icon active">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h2 class="queue-title active-title">입장 가능합니다!</h2>

      <div class="queue-countdown-wrap">
        <div class="queue-countdown" id="countdownNum">3</div>
        <p class="queue-desc">초 후 자동으로 이동합니다</p>
      </div>

      <button class="btn btn-primary btn-lg" onclick="goToBooking()"
              style="justify-content:center;min-width:200px;font-size:16px">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> 지금 입장하기
      </button>
    </div>

    <!-- ④ 만료 (토큰이 사라진 경우) -->
    <div id="stateExpired" class="queue-state" style="display:none">
      <div class="queue-icon" style="background:#fee2e2;color:#dc2626">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h2 class="queue-title" style="color:#dc2626">대기 시간이 초과되었습니다</h2>
      <p class="queue-desc">대기열을 다시 시작합니다...</p>
    </div>

    <!-- ⑤ 예매 시간 전 -->
    <div id="stateNotOpen" class="queue-state" style="display:none">
      <div class="queue-icon" style="background:#fef3c7;color:#d97706">
        <i class="fa-solid fa-clock"></i>
      </div>
      <h2 class="queue-title" style="color:#d97706">예매 준비 중입니다</h2>
      <p class="queue-desc" id="notOpenMsg">예매 오픈 시간에 다시 접속해 주세요.</p>
      <button class="btn btn-primary" onclick="location.reload()"
              style="justify-content:center;margin-top:12px">
        <i class="fa-solid fa-rotate-right"></i> 새로고침
      </button>
    </div>

    <!-- ⑥ 연결 오류 -->
    <div id="stateError" class="queue-state" style="display:none">
      <div class="queue-icon" style="background:#fee2e2;color:#dc2626">
        <i class="fa-solid fa-wifi" style="text-decoration:line-through"></i>
      </div>
      <h2 class="queue-title" style="color:#dc2626">연결 오류</h2>
      <p class="queue-desc" id="errorMsg">서버에 연결할 수 없습니다.</p>
      <button class="btn btn-primary" onclick="location.reload()"
              style="justify-content:center;margin-top:12px">
        <i class="fa-solid fa-rotate-right"></i> 다시 시도
      </button>
    </div>

  </div>
</div>

<script>
const TOKEN_KEY = 'queue_token';
const MAX_JOIN_RETRIES = 6;   // 최대 재시도 횟수 (초과 시 오류 화면)

let pollTimer      = null;
let countdownTimer = null;
let myToken        = localStorage.getItem(TOKEN_KEY) || '';
let isActiveShowing = false;
let joinRetryCount  = 0;

/* ── 초기화 ─────────────────────────────── */
async function init() {
  // CSRF 토큰 준비 완료까지 대기 (race condition 방지)
  if (window.csrfReady) await window.csrfReady;

  // 로그인 확인
  const me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  if (!me || !me.logged_in) { location.href = '/login'; return; }
  document.getElementById('userName').textContent = me.name;

  await joinQueue();
}

/* ── 대기열 참가 ─────────────────────────── */
async function joinQueue() {
  try {
    const body = myToken ? { token: myToken } : {};
    const res  = await fetch('/api/queue/join', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });

    /* ── 정상 응답 ── */
    if (res.ok) {
      joinRetryCount = 0;
      const data = await res.json();
      if (data.token) {
        myToken = data.token;
        localStorage.setItem(TOKEN_KEY, myToken);
      }
      if (data.status === 'active') {
        showActive(data.remaining);
      } else {
        showWaiting(data.position, data.active_count, data.eta_min);
        startPolling();
      }
      return;
    }

    /* ── 403 처리 ── */
    if (res.status === 403) {
      let errData = null;
      try { errData = await res.json(); } catch (e) {}

      // 예매 오픈 시간 전 → 안내 화면 표시 (재시도 안 함)
      if (errData && errData.open_time) {
        showNotOpenYet(errData.open_time_display || errData.open_time);
        return;
      }

      // CSRF 오류 → 토큰 재발급 후 재시도
      console.warn('Queue join 403 (CSRF?), retry', joinRetryCount + 1);
      if (joinRetryCount < MAX_JOIN_RETRIES) {
        joinRetryCount++;
        if (window.refreshCsrfToken) await window.refreshCsrfToken();
        setTimeout(joinQueue, 1500);
      } else {
        showError('서버 인증에 실패했습니다.<br>페이지를 새로고침 해주세요.');
      }
      return;
    }

    /* ── 기타 비정상 응답 ── */
    console.warn('Queue join non-OK:', res.status);
    if (joinRetryCount < MAX_JOIN_RETRIES) {
      joinRetryCount++;
      setTimeout(joinQueue, 2000);
    } else {
      showError('서버 응답 오류(' + res.status + ').<br>페이지를 새로고침 해주세요.');
    }

  } catch (err) {
    // 네트워크 오류
    console.error('Join error:', err);
    if (joinRetryCount < MAX_JOIN_RETRIES) {
      joinRetryCount++;
      setTimeout(joinQueue, 3000);
    } else {
      showError('네트워크 오류가 발생했습니다.<br>인터넷 연결을 확인하고 새로고침 해주세요.');
    }
  }
}

/* ── 폴링 시작 ───────────────────────────── */
function startPolling() {
  stopPolling();
  pollTimer = setInterval(poll, 3000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
