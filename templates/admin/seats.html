<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좌석 관리 - 예아단 특별공연</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ── 좌석 관리 전용 스타일 ── */
.seat-admin-wrap {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.seat-admin-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  flex-wrap: wrap;
  gap: 10px;
}
.seat-admin-header h3 {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
}

/* ── 층 탭 — 헤더 아래 별도 영역 ── */
.floor-tab-bar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 20px;
  background: #f8fafc;
  border-bottom: 2px solid var(--gray-mid);
}
.floor-tab {
  padding: 11px 28px;
  border: none;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--gray);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: -2px;   /* border-bottom 겹치기 */
  border-radius: 0;
}
.floor-tab:hover {
  color: var(--primary);
  background: #edf3fb;
}
.floor-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  background: white;
  font-weight: 700;
}
.floor-tab .tab-badge {
  font-size: 11px;
  background: var(--gray-mid);
  color: var(--gray);
  border-radius: 10px;
  padding: 1px 7px;
  font-weight: 600;
  transition: background .2s, color .2s;
}
.floor-tab.active .tab-badge {
  background: var(--primary);
  color: white;
}
.floor-tab-spacer { flex: 1; }

/* ── 통계 바 ── */
.seat-stats-bar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 10px 20px;
  background: var(--gray-light);
  border-bottom: 1px solid var(--gray-mid);
  flex-wrap: wrap;
  gap: 6px;
}
.ss-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--dark);
  background: white;
  border: 1px solid var(--gray-mid);
  border-radius: 8px;
  padding: 5px 12px;
}
.ss-dot {
  width: 11px; height: 11px;
  border-radius: 3px;
  flex-shrink: 0;
}
.ss-dot.available { background: #3B82F6; }
.ss-dot.blocked   { background: #fca5a5; border: 1px solid #f87171; }
.ss-dot.reserved  { background: #94a3b8; }
.ss-num {
  font-weight: 700;
  color: var(--primary);
  min-width: 28px;
  text-align: right;
}
.ss-num.red   { color: #dc2626; }
.ss-num.green { color: #10b981; }
.ss-label-floor {
  margin-left: auto;
  font-size: 12px;
  color: var(--gray);
  font-style: italic;
}

/* ── 안내 ── */
.admin-notice {
  padding: 9px 20px;
  background: #fefce8;
  border-bottom: 1px solid #fde68a;
  font-size: 12px;
  color: #92400e;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── 좌석 배치도 ── */
.seat-map-container {
  padding: 16px;
  overflow-x: auto;
  min-height: 380px;
  background: #f9fbfd;
}
.seat-map-container svg { display: block; margin: 0 auto; }

/* 관리자 모드: available 좌석 hover 시 빨간 preview */
.admin-mode-active .seat-rect.available:hover {
  fill: #ef4444 !important;
  opacity: .8;
  cursor: pointer;
}
/* 차단 좌석 hover 시 파란 preview (해제 예고) */
.admin-mode-active .seat-rect.admin-blocked:hover {
  fill: #3b82f6 !important;
  opacity: .8;
}
.admin-mode-active .seat-rect.reserved,
.admin-mode-active .seat-rect.mine {
  cursor: not-allowed;
}

/* ── 하단 액션 ── */
.seat-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: white;
  border-top: 1px solid var(--gray-mid);
  flex-wrap: wrap;
}
.blocked-badge {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 7px 16px;
  font-size: 13px;
  color: #dc2626;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 7px;
}
.blocked-badge span { font-size: 18px; }

/* ── Toast ── */
.admin-toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #1f2937;
  color: white;
  padding: 11px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  z-index: 9999;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .25s, transform .25s;
  pointer-events: none;
}
.admin-toast.show { opacity: 1; transform: translateY(0); }
.admin-toast.success { border-left: 4px solid #10B981; }
.admin-toast.danger  { border-left: 4px solid #EF4444; }
.admin-toast.warning { border-left: 4px solid #F59E0B; }
</style>
<script src="/static/js/csrf.js"></script>
</head>
<body>
<header class="navbar">
  <div class="brand">
    <div class="logo-icon"><i class="fa-solid fa-ticket"></i></div>
    예아단 특별공연
    <span style="font-size:11px;background:var(--accent);color:var(--primary-dark);padding:2px 8px;border-radius:6px;font-weight:700;margin-left:4px">관리자</span>
  </div>
  <nav>
    <a href="/"><i class="fa-solid fa-arrow-left"></i> 사용자 홈</a>
  </nav>
  <div class="user-info">
    <i class="fa-solid fa-user-shield" style="font-size:18px;opacity:.8"></i>
    <span id="adminName"></span>
    <button class="btn-logout" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
  </div>
</header>

<aside class="admin-nav">
  <div class="nav-section">메뉴</div>
  <a href="/admin/"><i class="fa-solid fa-chart-line"></i> <span>대시보드</span></a>
  <a href="/admin/members"><i class="fa-solid fa-users"></i> <span>회원 관리</span></a>
  <a href="/admin/reservations"><i class="fa-solid fa-ticket"></i> <span>예매 관리</span></a>
  <a href="/admin/seats" class="active"><i class="fa-solid fa-map-location-dot"></i> <span>좌석 관리</span></a>
</aside>

<main class="admin-content">
  <div class="page-header">
    <div class="ph-icon"><i class="fa-solid fa-map-location-dot"></i></div>
    <div>
      <h1>좌석 관리</h1>
      <p>좌석을 클릭하여 예매 불가 차단/해제를 설정합니다.</p>
    </div>
  </div>

  <div class="seat-admin-wrap">

    <!-- ① 헤더 -->
    <div class="seat-admin-header">
      <h3><i class="fa-solid fa-chair"></i> 좌석 배치도 — 관리자 모드</h3>
      <div style="font-size:12px;opacity:.8">
        <i class="fa-solid fa-circle-info"></i>
        파란 좌석 클릭 → 차단&nbsp;|&nbsp;빨간 좌석 클릭 → 해제
      </div>
    </div>

    <!-- ② 층 탭 (헤더 아래 독립 영역) -->
    <div class="floor-tab-bar">
      <button class="floor-tab active" id="tab1" onclick="switchFloor(1)">
        <i class="fa-solid fa-building"></i>
        1층
        <span class="tab-badge" id="badge1">-</span>
      </button>
      <button class="floor-tab" id="tab2" onclick="switchFloor(2)">
        <i class="fa-solid fa-building-columns"></i>
        2층
        <span class="tab-badge" id="badge2">-</span>
      </button>
      <div class="floor-tab-spacer"></div>
      <span id="statFloorLabel" style="font-size:12px;color:var(--gray);padding:0 4px"></span>
    </div>

    <!-- ③ 통계 바 (현재 층 기준) -->
    <div class="seat-stats-bar">
      <div class="ss-item">
        <div class="ss-dot available"></div>
        <span>예매가능</span>
        <span class="ss-num" id="statAvail">-</span>석
      </div>
      <div class="ss-item">
        <div class="ss-dot reserved"></div>
        <span>예매완료</span>
        <span class="ss-num green" id="statReserved">-</span>석
      </div>
      <div class="ss-item">
        <div class="ss-dot blocked"></div>
        <span>차단</span>
        <span class="ss-num red" id="statBlocked">-</span>석
      </div>
      <div class="ss-item">
        <i class="fa-solid fa-layer-group" style="color:var(--gray);font-size:11px"></i>
        <span>합계</span>
        <span class="ss-num" id="statTotal">-</span>석
      </div>
      <div class="ss-label-floor" id="statNote"></div>
    </div>

    <!-- ④ 안내 -->
    <div class="admin-notice">
      <i class="fa-solid fa-circle-info"></i>
      <strong>파란 좌석</strong> 클릭 → <strong style="color:#dc2626">예매 불가(×) 차단</strong> &nbsp;|&nbsp;
      <strong style="color:#dc2626">빨간 좌석</strong> 클릭 → <strong style="color:#2563eb">차단 해제</strong> &nbsp;|&nbsp;
      회색(예매완료)은 변경 불가
    </div>

    <!-- ⑤ 좌석 배치도 -->
    <div class="seat-map-container admin-mode-active">
      <svg id="seatMapSvg"></svg>
    </div>

    <!-- ⑥ 하단 액션 -->
    <div class="seat-actions">
      <div class="blocked-badge">
        <i class="fa-solid fa-ban"></i>
        현재 층 차단 좌석:
        <span id="blockedBadgeNum">0</span>석
      </div>
      <button class="btn btn-sm" style="background:#f1f5f9;color:#374151;border:1px solid #d1d5db"
              onclick="loadFloor(currentFloor)">
        <i class="fa-solid fa-rotate"></i> 새로고침
      </button>
    </div>
  </div>
</main>

<div class="admin-toast" id="adminToast"></div>

<script src="/static/js/seatmap.js"></script>
<script>
let currentFloor = 1;
// 전체 층 통계 캐시 (탭 배지용)
let allStats = { 1: {avail:0, reserved:0, blocked:0, total:0},
                 2: {avail:0, reserved:0, blocked:0, total:0} };

/* ── 초기화 ── */
async function init() {
  const me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  if (!me || !me.is_admin) { location.href = '/login'; return; }
  document.getElementById('adminName').textContent = me.name;

  SeatMap.setAdminMode(true);

  // 좌석 토글 후 콜백: 배지·통계 갱신
  window.onAdminSeatToggle = ({ newStatus }) => {
    showToast(
      newStatus === 'blocked' ? '차단 등록했습니다.' : '차단 해제했습니다.',
      newStatus === 'blocked' ? 'danger' : 'success'
    );
    // 통계는 API 재조회 없이 SeatMap 메모리에서 바로 반영
    renderFloorStats();
  };

  // 전체 통계 먼저 로드 (탭 배지)
  await fetchAllStats();
  renderTabBadges();

  // 1층 로드
  await loadFloor(1);
}

/* ── 층 로드 ── */
async function loadFloor(floor) {
  currentFloor = floor;

  // 탭 활성화
  document.getElementById('tab1').classList.toggle('active', floor === 1);
  document.getElementById('tab2').classList.toggle('active', floor === 2);

  // 좌석 배치도 로드
  await SeatMap.load(floor, 'seatMapSvg');

  // 통계를 SeatMap 메모리에서 바로 계산
  renderFloorStats();
}

/* ── 층 탭 전환 ── */
function switchFloor(floor) {
  if (floor === currentFloor) return;
  loadFloor(floor);
}

/* ── SeatMap 메모리 기반 현재 층 통계 렌더링 ── */
function renderFloorStats() {
  // SeatMap이 로드한 좌석들을 getBlockedCount 등으로 접근
  // 더 정확하게는 API 응답을 파싱하는 것이 좋으나,
  // SeatMap은 내부 seats 객체를 노출하지 않으므로 API 재조회
  fetchFloorStats(currentFloor);
}

/* ── 현재 층 통계 API 조회 ── */
async function fetchFloorStats(floor) {
  try {
    const res  = await fetch(`/api/admin/seats?floor=${floor}`);
    const data = await res.json();
    const seats = data.seats || [];

    const avail    = seats.filter(s => s.status === 'available').length;
    const reserved = seats.filter(s => s.status === 'reserved').length;
    const blocked  = seats.filter(s => s.status === 'blocked').length;
    const total    = seats.length;

    // 통계 캐시 업데이트
    allStats[floor] = { avail, reserved, blocked, total };

    // DOM 업데이트
    document.getElementById('statAvail').textContent    = avail;
    document.getElementById('statReserved').textContent = reserved;
    document.getElementById('statBlocked').textContent  = blocked;
    document.getElementById('statTotal').textContent    = total;
    document.getElementById('statNote').textContent     = `(${floor}층 기준)`;

    // 하단 배지: 현재 층 차단 좌석 수
    document.getElementById('blockedBadgeNum').textContent = blocked;

    // 탭 배지 갱신
    renderTabBadges();
  } catch (e) {
    console.error('fetchFloorStats error:', e);
  }
}

/* ── 전체 층 통계 로드 (초기 탭 배지용) ── */
async function fetchAllStats() {
  try {
    const res  = await fetch('/api/admin/seats');
    const data = await res.json();
    const all  = data.seats || [];

    [1, 2].forEach(f => {
      const fs = all.filter(s => s.floor === f);
      allStats[f] = {
        avail:    fs.filter(s => s.status === 'available').length,
        reserved: fs.filter(s => s.status === 'reserved').length,
        blocked:  fs.filter(s => s.status === 'blocked').length,
        total:    fs.length
      };
    });
  } catch (e) {
    console.error('fetchAllStats error:', e);
  }
}

/* ── 탭 배지 (각 층의 차단 좌석 수) ── */
function renderTabBadges() {
  document.getElementById('badge1').textContent =
    allStats[1].blocked > 0 ? `차단 ${allStats[1].blocked}` : `${allStats[1].total}석`;
  document.getElementById('badge2').textContent =
    allStats[2].blocked > 0 ? `차단 ${allStats[2].blocked}` : `${allStats[2].total}석`;
}

/* ── Toast ── */
let toastTimer = null;
function showToast(msg, type = 'success') {
  const el = document.getElementById('adminToast');
  el.textContent = msg;
  el.className   = `admin-toast ${type} show`;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
}

init();
</script>
</body>
</html>
